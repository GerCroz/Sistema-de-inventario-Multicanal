type Producto {
  id: ID!
  nombre: String!
  precio: Float!
  stock: Int!
  created_at: String
  updated_at: String
}

type Query {
  productos: [Producto!]! @all(model: "App\\Models\\Producto")
  producto(id: ID! @eq): Producto @find(model: "App\\Models\\Producto")
}

type Mutation {
  crearProducto(
    nombre: String! @rules(apply: ["required", "string", "max:100"])
    precio: Float! @rules(apply: ["required", "numeric", "min:0"])
    stock: Int! @rules(apply: ["required", "integer", "min:0"])
  ): Producto @field(resolver: "App\\GraphQL\\Mutations\\CrearProducto")

  actualizarStock(
    id: ID! @rules(apply: ["required", "exists:productos,id"])
    stock: Int! @rules(apply: ["required", "integer", "min:0"])
  ): Producto @field(resolver: "App\\GraphQL\\Mutations\\ActualizarStock")
}
